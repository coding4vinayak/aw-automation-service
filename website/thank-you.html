<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Thank You | AutoFlow</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        * { font-family: 'Inter', sans-serif; }
        .gradient-bg { background: linear-gradient(135deg, #6366f1 0%, #8b5cf6 50%, #06b6d4 100%); }
    </style>
</head>
<body class="bg-gray-50 min-h-screen flex items-center justify-center px-4">
    <div class="max-w-md w-full text-center">
        <div class="text-6xl mb-6">✅</div>
        <h1 class="text-3xl font-bold mb-4">Thanks for Reaching Out!</h1>
        <p class="text-gray-600 mb-8">
            We've received your message and will get back to you within 24 hours.
        </p>
        <div class="bg-white p-6 rounded-2xl shadow-sm border border-gray-100 mb-8">
            <h2 class="font-semibold mb-2">What happens next?</h2>
            <ul class="text-left text-gray-600 space-y-2">
                <li class="flex items-start">
                    <span class="text-green-500 mr-2">✓</span>
                    We'll review your information
                </li>
                <li class="flex items-start">
                    <span class="text-green-500 mr-2">✓</span>
                    Send you a custom proposal
                </li>
                <li class="flex items-start">
                    <span class="text-green-500 mr-2">✓</span>
                    Schedule a free consultation call
                </li>
            </ul>
        </div>
        <a href="index.html" class="gradient-bg text-white px-8 py-3 rounded-full font-medium hover:opacity-90 transition">
            ← Back to Home
        </a>
    </div>
    <script src="js/enquiry.js"></script>
</body>
</html>
